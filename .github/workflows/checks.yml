# .github/workflows/checks.yml — Automatic code check (fix pack M).
# Runs on every push and pull request. If anything fails, GitHub shows a red X
# on the commit and emails you, so a broken file is caught BEFORE it's uploaded.
#
#  1. PHP syntax check of every .php file on PHP 8.5 (same as the live server)
#  2. JavaScript syntax check of every file in js/
#  3. js/min.site.js is up to date with its source files (tools/build-js.mjs)
#
# The result is also posted as a commit status ("CI / Code check"), so tools that read
# GitHub's older commit-status list (e.g. ChatGPT's GitHub connector) see a result
# instead of "no CI test results".
name: Code check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: none

      - name: PHP syntax check
        run: |
          php -v | head -1
          fail=0; n=0
          while IFS= read -r -d '' f; do
            n=$((n+1))
            out=$(php -l "$f" 2>&1) || { echo "::error file=$f::$out"; fail=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0)
          echo "Checked $n PHP files"
          exit $fail

      - name: SQL misuse guard (audit Nov 2026)
        run: |
          fail=0
          # execute() returns bool: "(int)$pdo->prepare(...)->execute(...)" is always 1 (caused the pass-type key bug)
          if grep -rnE --include='*.php' -e '\(int\)[[:space:]]*\$[A-Za-z_]+->prepare\(.*\)->execute\(' . ; then
            echo "::error::Use \$st = \$pdo->prepare(...); \$st->execute([...]); \$st->fetchColumn() — execute() returns true/false, not the result."; fail=1; fi
          # Request data must never be pasted into SQL text
          if grep -rnE --include='*.php' -e '->(query|exec|prepare)\("[^"]*\$_(GET|POST|REQUEST|COOKIE)' . ; then
            echo "::error::Request data is interpolated into SQL — use a prepared statement with ? placeholders."; fail=1; fi
          exit $fail

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: |
          fail=0
          for f in js/*.js; do node --check "$f" || { echo "::error file=$f::syntax error"; fail=1; }; done
          exit $fail

      - name: Combined script is up to date
        run: |
          npm i --no-save --no-audit --no-fund terser@5.51.2
          node tools/build-js.mjs
          if ! git diff --quiet -- js/min.site.js; then
            echo "::error file=js/min.site.js::js/min.site.js is out of date. Run: node tools/build-js.mjs, then commit and upload it."
            git diff --stat -- js/min.site.js
            exit 1
          fi

      - name: Admin stylesheet is up to date
        run: |
          cd tools/admin-css && npm ci --no-audit --no-fund && npm run build && cd ../..
          if ! git diff --quiet -- admin/assets/admin.css; then
            echo "::error file=admin/assets/admin.css::admin/assets/admin.css is out of date. Run: cd tools/admin-css && npm ci && npm run build, then commit and upload it."
            exit 1
          fi
          # Standalone admin pages use a strict policy: inline style blocks/attributes in the shell would be blocked.
          if grep -nE '<style|style="' admin/views/layout/sidebar.php includes/admin_shell.php; then
            echo "::error::The admin shell must not use inline styles (strict policy). Put them in admin/assets/admin-shell.css."; exit 1; fi

      - name: Report result as a commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" -f context="CI / Code check" -f target_url="$RUN_URL" \
            -f description="PHP syntax, SQL guard, JS syntax, bundle up to date: $STATE"
