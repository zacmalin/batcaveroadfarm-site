name: Temporary admin CSS rebuild
on:
  push:
    branches:
      - chore/rebuild-admin-css-20261116
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact locked CSS
        run: |
          cd tools/admin-css
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated styles on isolated branch
        run: |
          git add admin/assets/admin.css admin/assets/console.css
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Rebuild generated admin styles'
            git push
          fi
