# .github/workflows/tasks.yml — tasks and chores (Farm OS Phase 3, Nov 11, 2026).
# Runs tests/tasks_test.php against a throwaway MySQL 8 database built from every migration:
# chore days, open-days-only, seasons, the generator, checklists, statuses, and who sees what;
# then tests/task_forms_test.php (slice 2): questions, follow-ups, photos, the morning list and late-task emails;
# then tests/event_tasks_test.php (slice 3): party and booking checklists;
# then tests/event_quotes_test.php (slice 4): quotes, deposits and payments for bookings and parties;
# then tests/capacity_holds_test.php (slice 5): capacity holds, group arrival at the gate and weather days;
# then tests/customer_portal_test.php (slice 6): sign-in links and what a customer sees in My farm;
# then tests/calendar_test.php: the master calendar and phone calendar feeds;
# then tests/parties_test.php: party packages, guest lists and assigned staff;
# then tests/crm_test.php: one customer record, households, organizations and merging duplicates;
# then tests/email_prefs_test.php: email preferences, consent and the send check;
# then tests/animals_test.php (Phase 5 slice 1): animal status, enclosures and moves;
# then tests/animal_care_test.php (Phase 5 slice 2): care and feeding logs, feed out of stock;
# then tests/animal_health_test.php (Phase 5 slice 3): medical records, medication dose tasks, vaccinations due;
# then tests/animal_weights_test.php (Phase 5 slice 4): weighings, change alerts, voiding, the chart;
# then tests/animal_schedules_test.php (Phase 5 slice 5): species care schedules, their tasks, finishing logs the care.
# then tests/animal_breeding_test.php (Phase 5 slice 6): breedings, the due task, outcomes, births adding kids, parents.
# then tests/animal_expenses_test.php (Phase 5 slice 7): other expenses, vet and feed costs, feed split, totals, CSV.
# then tests/incidents_test.php (Phase 5 slice 8): reports, owner email, follow-up task, waiver/check-in matching, change history.
# then tests/animal_public_test.php (Phase 5 slice 9): public pages, age line, fun facts, photos, nothing private on the website.
# then tests/permission_sections_test.php: the Permissions page save changes only what the page shows.
# then tests/kitchen_test.php (Phase 4 slice 1): units to grams, heaviest-first ingredient lists, sub-recipes, allergens, ingredient saves.
# then tests/kitchen_versions_test.php (Phase 4 slice 2): recipe versions, what changed, recipe → product links, batch weight check.
# then tests/kitchen_bible_test.php (Phase 4): the house Recipe Bible, cooking order, batch size.
# Never touches a real database.
name: Tasks test

on:
  push:
    paths: ['includes/tasks.php', 'includes/task_notify.php', 'admin/migrations/**', 'tests/tasks_test.php', 'tests/task_forms_test.php', 'includes/event_tasks.php', 'tests/event_tasks_test.php', 'includes/event_quotes.php', 'tests/event_quotes_test.php', 'includes/admission.php', 'includes/capacity_holds.php', 'includes/weather_days.php', 'tests/capacity_holds_test.php', 'includes/customer_portal.php', 'tests/customer_portal_test.php', 'includes/calendar.php', 'tests/calendar_test.php', 'includes/parties.php', 'tests/parties_test.php', 'includes/crm.php', 'tests/crm_test.php', 'includes/email_prefs.php', 'tests/email_prefs_test.php', 'includes/party_emails.php', 'tests/party_emails_test.php', 'includes/waivers.php', 'tests/waivers_test.php', 'includes/animals.php', 'tests/animals_test.php', 'includes/animal_care.php', 'tests/animal_care_test.php', 'includes/animal_health.php', 'tests/animal_health_test.php', 'includes/animal_weights.php', 'tests/animal_weights_test.php', 'includes/animal_schedules.php', 'tests/animal_schedules_test.php', 'includes/animal_breeding.php', 'tests/animal_breeding_test.php', 'includes/animal_expenses.php', 'tests/animal_expenses_test.php', 'includes/incidents.php', 'tests/incidents_test.php', 'includes/animal_public.php', 'tests/animal_public_test.php', 'includes/permission_sections.php', 'tests/permission_sections_test.php', 'includes/kitchen.php', 'admin/includes/label_ingredients.php', 'tests/kitchen_test.php', 'includes/kitchen_versions.php', 'tests/kitchen_versions_test.php', 'includes/kitchen_bible.php', 'includes/units.php', 'tests/kitchen_bible_test.php', 'includes/stock.php', 'admin/cron/send_booking_reminders.php', 'admin/cron/send_review_requests.php', '.github/workflows/tasks.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bcrf_tasks_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, gd
          coverage: none
          tools: none
      - name: Task and chore rules
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: bcrf_tasks_test
          DB_USER: root
          DB_PASS: root
        run: php tests/tasks_test.php
      - name: Questions, photos, follow-ups and task emails
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: bcrf_tasks_test
          DB_USER: root
          DB_PASS: root
        run: php tests/task_forms_test.php
      - name: Party and booking checklists
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: bcrf_tasks_test
          DB_USER: root
          DB_PASS: root
        run: php tests/event_tasks_test.php
      - name: Quotes, deposits and payments
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: bcrf_tasks_test
          DB_USER: root
          DB_PASS: root
        run: php tests/event_quotes_test.php
      - name: Capacity holds, arrivals and weather days
