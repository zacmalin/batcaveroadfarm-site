name: Roost Rewards integration tests
on:
  pull_request:
    paths:
      - 'includes/rewards.php'
      - 'includes/roost-*.php'
      - 'admin/migrations/0016_farm_rewards_foundation.php'
      - 'admin/migrations/0017_roost_rewards_attendance.php'
      - 'admin/migrations/0018_roost_refund_processing.php'
      - 'passes/roost_*.php'
      - 'roost-rewards/**'
      - 'faq/index.php'
      - 'privacy/index.php'
      - 'terms/index.php'
      - 'includes/footer.php'
      - 'tests/rewards_integration.php'
      - 'tests/rewards_concurrency_worker.php'
      - 'tests/rewards_production_preflight.php'
      - 'tests/rewards_pos_preview.php'
      - 'includes/rewards-pos-preview.php'
      - '.github/workflows/rewards-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: rewards_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql
          coverage: none
      - name: PHP syntax
        run: |
          for file in includes/rewards.php includes/rewards-pos-preview.php includes/roost-*.php admin/migrations/0016_farm_rewards_foundation.php admin/migrations/0017_roost_rewards_attendance.php admin/migrations/0018_roost_refund_processing.php passes/roost_*.php roost-rewards/index.php tests/rewards_integration.php tests/rewards_concurrency_worker.php tests/rewards_production_preflight.php tests/rewards_pos_preview.php; do
            php -l "$file" || exit 1
          done
      - name: Rewards MySQL integration
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_integration.php
      - name: POS eligibility tests
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_preview.php
