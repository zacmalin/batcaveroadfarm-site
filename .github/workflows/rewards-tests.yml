name: Roost Rewards integration tests
on:
  pull_request:
    paths:
      - 'includes/rewards.php'
      - 'includes/roost-*.php'
      - 'admin/migrations/0016_farm_rewards_foundation.php'
      - 'admin/migrations/0017_roost_rewards_attendance.php'
      - 'admin/migrations/0018_roost_refund_processing.php'
      - 'admin/migrations/0019_roost_pos_outbox.php'
      - 'passes/roost_*.php'
      - 'roost-rewards/**'
      - 'faq/index.php'
      - 'privacy/index.php'
      - 'terms/index.php'
      - 'includes/footer.php'
      - 'tests/rewards_integration.php'
      - 'tests/rewards_concurrency_worker.php'
      - 'tests/rewards_production_preflight.php'
      - 'tests/rewards_pos_preview.php'
      - 'tests/rewards_pos_lifecycle.php'
      - 'tests/rewards_pos_outbox.php'
      - 'tests/rewards_pos_outbox_worker.php'
      - 'tests/rewards_pos_outbox_health.php'
      - 'tests/rewards_pos_outbox_preview.php'
      - 'tests/rewards_pos_outbox_ledger_map.php'
      - 'tests/rewards_pos_outbox_receipt.php'
      - 'tests/rewards_pos_outbox_dispatch.php'
      - 'tests/rewards_pos_outbox_test_handler.php'
      - 'includes/rewards-pos-preview.php'
      - '.github/workflows/rewards-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.5']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: rewards_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql
          coverage: none
      - name: PHP syntax
        run: |
          for file in includes/rewards.php includes/rewards-pos-preview.php includes/roost-*.php admin/migrations/0016_farm_rewards_foundation.php admin/migrations/0017_roost_rewards_attendance.php admin/migrations/0018_roost_refund_processing.php admin/migrations/0019_roost_pos_outbox.php passes/roost_*.php roost-rewards/index.php tests/rewards_integration.php tests/rewards_concurrency_worker.php tests/rewards_production_preflight.php tests/rewards_pos_preview.php tests/rewards_pos_lifecycle.php tests/rewards_pos_outbox.php tests/rewards_pos_outbox_worker.php tests/rewards_pos_outbox_health.php tests/rewards_pos_outbox_preview.php tests/rewards_pos_outbox_ledger_map.php tests/rewards_pos_outbox_receipt.php tests/rewards_pos_outbox_dispatch.php tests/rewards_pos_outbox_test_handler.php tests/rewards_pos_outbox_policy.php tests/rewards_pos_outbox_integration.php tests/rewards_pos_source_guards.php; do
            php -l "$file" || exit 1
          done
      - name: Rewards MySQL integration
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_integration.php
      - name: POS eligibility tests
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_preview.php

      - name: Disabled POS lifecycle gate tests
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_lifecycle.php

      - name: Dormant POS outbox tests
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox.php

      - name: POS outbox claim and retry tests
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_worker.php

      - name: POS outbox health metrics tests
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_health.php

      - name: POS outbox event preview guards
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_preview.php

      - name: POS ledger event mapping guards
        run: php tests/rewards_pos_outbox_ledger_map.php

      - name: POS ledger receipt recovery guards
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_receipt.php

      - name: Inert POS dispatch guards
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_dispatch.php

      - name: Explicitly authorized POS test handler guards
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_test_handler.php

      - name: POS policy resolver fail-closed guards
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_policy.php

      - name: Disabled POS transactional adapter guards
        env:
          BCRF_REWARDS_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=rewards_test;charset=utf8mb4
          BCRF_REWARDS_TEST_USER: root
          BCRF_REWARDS_TEST_PASSWORD: testpass
        run: php tests/rewards_pos_outbox_integration.php

      - name: POS source transaction and activation guards
        run: php tests/rewards_pos_source_guards.php
