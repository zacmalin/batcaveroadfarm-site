# .github/workflows/gift_cards.yml — gift cards (Farm OS Phase 2, Nov 11, 2026).
# Runs tests/gift_cards_test.php against a throwaway MySQL 8 database built from every migration:
# selling, spending, split payments, refunds, voids, online orders, admin changes, and the ledger always matching.
# Never touches a real database.
name: Gift cards test

on:
  push:
    paths: ['includes/gift_cards.php', 'includes/sales.php', 'includes/refunds.php', 'includes/drawers.php', 'admin/migrations/**', 'tests/gift_cards_test.php', '.github/workflows/gift_cards.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bcrf_gc_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Gift card rules
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: bcrf_gc_test
          DB_USER: root
          DB_PASS: root
        run: php tests/gift_cards_test.php
