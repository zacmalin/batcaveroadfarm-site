# Build js/min.site.js on GitHub (Nov 2026).
# For when the bundle can't be built locally (Zac works from a phone). Actions → "Build JS" →
# Run workflow → pick the branch. It runs tools/build-js.mjs with terser and commits js/min.site.js
# back to that branch if it changed. Then upload js/min.site.js to the server.
name: Build JS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build js/min.site.js
        run: |
          npm i --no-save --no-audit --no-fund terser@5.51.2
          node tools/build-js.mjs
          node --check js/min.site.js
      - name: Commit if changed
        run: |
          if git diff --quiet -- js/min.site.js; then echo "min.site.js already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add js/min.site.js
          git commit -m "Build js/min.site.js"
          git push
