# .github/workflows/rewards.yml — Roost Rewards rules test (lean version, Nov 2026).
# Runs tests/rewards_test.php against a throwaway MySQL 8 database. Never touches a real database.
name: Roost Rewards test

on:
  push:
    paths: ['includes/rewards.php', 'includes/sales.php', 'includes/refunds.php', 'admin/migrations/0016_roost_rewards.php', 'tests/rewards_test.php', '.github/workflows/rewards.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bcrf_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql
          coverage: none
          tools: none
      - name: Rewards rules
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: bcrf_test
          DB_USER: root
          DB_PASS: root
        run: php tests/rewards_test.php
